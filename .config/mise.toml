[tools]
biome = "2.5.14"
cocogitto = "7.0.0"
lefthook = "2.1.14"
node = "26.9.0"
pnpm = "12.5.1"

[hooks]
postinstall = "lefthook install"

[env]
_.path = ["./node_modules/.bin"]

[settings]
disable_backends = ["asdf"]
use_versions_host = false
minimum_release_age = "1d"

[tasks.dev]
description = "Dev mode"
run = "node --watch src/main.ts"

[tasks.lint]
description = "Check files with biome"
run = "mise exec -- biome check --no-errors-on-unmatched"

[tasks.lint-fix]
description = "Fix files with biome"
run = "mise exec -- biome check --no-errors-on-unmatched --write"

[tasks.typecheck]
description = "Run tsc"
run = "mise exec -- tsc"

[tasks.test]
description = "Run vitest"
run = "mise exec -- vitest --coverage"

[tasks.test-staged]
description = "Run vitest on staged files"
run = "mise exec -- vitest related --bail=1 --reporter=github-actions"

[tasks.test-ci]
description = "Run vitest in ci mode"
run = "mise exec -- vitest --bail=1 --reporter=github-actions"

[tasks.sync-branch]
description = "Sync package manager deps"
run = """
mise install
mise prune -y
mise exec -- pnpm install --frozen-lockfile
"""
